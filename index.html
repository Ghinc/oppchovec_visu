<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Interactive OppChoVec</title>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dom-to-image/2.6.0/dom-to-image.min.js"></script>
  <link rel="stylesheet" href="stage_ambroise/Code/WEB/dashboard.css">
</head>
<body>
  <div id="app">
    <aside>
        <!-- Section d'import masquée car les fichiers sont chargés automatiquement -->
        <div class="section" style="display: none;">
            <h2>1. Import des fichiers</h2>
            <h3>Fichiers des indicateurs</h3>
            <input type="file" id="file" multiple accept=".json" /><br>
            <h3>GeoJSON des communes</h3>
            <input type="file" id="file_geojson" multiple accept=".geojson" /><br>
            <button id="validateBtn">Valider les fichiers</button>
        </div>
      <!-- 1. Sélection de la commune -->
      <div class="section">
        <h2 data-translate="commune-title">2. Municipality selection</h2>
        <select id="communeSelect" style="width:100%; padding:0.5em;">
          <option value="" data-translate="commune-select">-- Select a municipality --</option>
        </select>
        <button id="validerCommune" style="margin-top: 0.5em;" data-translate="commune-validate">Validate</button>
      </div>

      <div class="section">
        <h3 data-translate="commune-info">Selected municipality information:</h3>
        <div id="resultCommune" style="background: #f8f8f8; padding: 1em; border-radius: 8px;"></div>
      </div>

      <!-- Contrôle du réseau routier -->
      <div class="section">
        <h2 data-translate="routes-title">3. Affichage des routes</h2>
        <div style="display: flex; flex-direction: column; gap: 0.5em;">
          <label style="display: flex; align-items: center; cursor: pointer;">
            <input type="checkbox" id="checkbox-nationales" class="route-checkbox" checked>
            <span style="margin-left: 0.5em;" data-translate="routes-national">Routes nationales (647)</span>
          </label>
          <label style="display: flex; align-items: center; cursor: pointer;">
            <input type="checkbox" id="checkbox-departementales" class="route-checkbox">
            <span style="margin-left: 0.5em;" data-translate="routes-departmental">Routes départementales (2654)</span>
          </label>
          <label style="display: flex; align-items: center; cursor: pointer;">
            <input type="checkbox" id="checkbox-communales" class="route-checkbox">
            <span style="margin-left: 0.5em;" data-translate="routes-municipal">Routes communales (3686)</span>
          </label>
          <label style="display: flex; align-items: center; cursor: pointer;">
            <input type="checkbox" id="checkbox-toutes" class="route-checkbox">
            <span style="margin-left: 0.5em;" data-translate="routes-all">Toutes les routes (7002)</span>
          </label>
        </div>
      </div>

      <!-- Contrôle de la langue -->
      <div class="section">
        <h2>4. Language</h2>
        <label style="display: flex; align-items: center; cursor: pointer;">
          <input type="checkbox" id="checkbox-english" checked>
          <span style="margin-left: 0.5em;">English labels</span>
        </label>
        <label style="display: flex; align-items: center; cursor: pointer; margin-top: 0.5em;">
          <input type="checkbox" id="checkbox-copyright" checked onchange="document.querySelectorAll('.copyright-control').forEach(el => el.style.display = this.checked ? '' : 'none')">
          <span style="margin-left: 0.5em;">Afficher le copyright</span>
        </label>
      </div>

      <!-- Pondérations p_k (OppChoVec) -->
      <div class="section">
        <h2>5. Pondérations p_k</h2>
        <button id="btn-toggle-pk" onclick="toggleModePk()">p_k : égal [1,1,1]</button>
        <div id="pk-values-display" style="margin-top: 6px; font-size: 12px; color: #555; font-style: italic;">Pondérations égales (p_k = 1/3 chacun)</div>
      </div>

      <!-- Téléchargements -->
      <div class="section">
        <h2>6. Téléchargements</h2>
        <a href="downloads/stats_descriptives_betti_0_10.xlsx" download>
          <button style="width:100%; margin-bottom:6px;">📥 Stats descriptives (Betti, 0-10)</button>
        </a>
        <a href="downloads/oppchovec_betti_0_10_trie.xlsx" download>
          <button style="width:100%;">📥 Classement OppChoVec (Betti, 0-10)</button>
        </a>
      </div>
    </aside>
    <main>
      <div class="tabs-container">
        <div class="tabs">
          <button class="tab-button active" data-tab="oppchovectab" id="tab-oppchovec">OppChoVec</button>
          <button class="tab-button" data-tab="opptab" id="tab-opp">Opp</button>
          <button class="tab-button" data-tab="chotab" id="tab-cho">Cho</button>
          <button class="tab-button" data-tab="vectab" id="tab-vec">Vec</button>
        </div>
        <div class="tab-content active" id="oppchovectab">
          <div id="map-oppchovec" class="map"></div>
        </div>
        <div class="tab-content" id="opptab">
          <div id="map-opp" class="map"></div>
        </div>
        <div class="tab-content" id="chotab">
          <div id="map-cho" class="map"></div>
        </div>
        <div class="tab-content" id="vectab">
          <div id="map-vec" class="map"></div>
        </div>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="stage_ambroise/Code/WEB/lisa_data.js"></script>
  <script src="stage_ambroise/Code/WEB/lisa_data_1pct.js"></script>
  <script src="stage_ambroise/Code/WEB/lisa_data_betti.js"></script>
  <script src="stage_ambroise/Code/WEB/lisa_data_betti_1pct.js"></script>
  <script src="stage_ambroise/Code/WEB/cah_data.js"></script>
  <script src="stage_ambroise/Code/WEB/script.js"></script>
</body>
</html>
